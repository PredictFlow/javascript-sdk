name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) - no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # npm trusted publishing needs npm >= 11.5.1, which needs Node >=
      # 22.14 - the separate CI workflow's 18/20/22 matrix is about
      # testing broad consumer compatibility and is unrelated to this
      # requirement, so it stays as-is.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Catches the easy mistake: tagging v0.2.0 while package.json still
      # says 0.1.0 would publish a version to npm that doesn't match the
      # git tag it supposedly came from.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN / NPM_TOKEN - npm's CLI detects the OIDC
      # context from id-token: write above and authenticates against
      # the trusted-publisher relationship configured on npm's side
      # (package Settings -> Trusted publishing), falling back to a
      # token only if that's absent.
      - run: npm publish --access public
